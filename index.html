<body class="min-h-screen relative overflow-x-hidden">

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect, useMemo, useCallback } = React;
const { 
    ResponsiveContainer, ComposedChart, Line, Area, Bar, XAxis, YAxis, 
    CartesianGrid, Tooltip, Legend, ReferenceLine, Scatter 
} = Recharts;

// --- ICONS ---
const Icons = {
    Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
    TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
    AlertTriangle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
    Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
};

// --- KEYS & CONFIG ---
const API_KEYS = {
    MARKETSTACK: 'adc91e9b5f1decaabf6d74dc20a4416f',
    FMP: 'zZ5zECyopZEcPtKvkqlb1R52jv2vFusj', 
    FINNHUB: 'd22igc9r01qr7ajlkob0d22igc9r01qr7ajlkobg',
    ALPHAVANTAGE: 'JQQUUJQRAX8TLXSM'
};

// --- UTILS: MATH & INDICATORS ---

const calculateSMA = (data, window) => {
    if (!data || data.length < window) return [];
    let smaData = new Array(data.length).fill(null);
    for (let i = window - 1; i < data.length; i++) {
        const slice = data.slice(i - window + 1, i + 1);
        const sum = slice.reduce((acc, curr) => acc + curr.close, 0);
        smaData[i] = sum / window;
    }
    return smaData;
};

const calculateEMA = (data, window) => {
    if (!data || data.length < window) return [];
    let k = 2 / (window + 1);
    let emaData = new Array(data.length).fill(null);
    // Start with SMA
    const initialSlice = data.slice(0, window);
    let ema = initialSlice.reduce((acc, curr) => acc + curr.close, 0) / window;
    emaData[window - 1] = ema;
    
    for (let i = window; i < data.length; i++) {
        ema = (data[i].close * k) + (ema * (1 - k));
        emaData[i] = ema;
    }
    return emaData;
};

const calculateRSI = (data, period = 14) => {
    let rsiData = new Array(data.length).fill(null);
    let gains = 0;
    let losses = 0;

    for (let i = 1; i < period + 1; i++) {
        const diff = data[i].close - data[i - 1].close;
        if (diff >= 0) gains += diff;
        else losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for (let i = period + 1; i < data.length; i++) {
        const diff = data[i].close - data[i - 1].close;
        const currentGain = diff > 0 ? diff : 0;
        const currentLoss = diff < 0 ? -diff : 0;
        
        avgGain = ((avgGain * (period - 1)) + currentGain) / period;
        avgLoss = ((avgLoss * (period - 1)) + currentLoss) / period;
        
        const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        rsiData[i] = 100 - (100 / (1 + rs));
    }
    return rsiData;
};

const calculateBollingerBands = (data, period = 20, multiplier = 2) => {
    const smas = calculateSMA(data, period);
    return data.map((d, i) => {
        if (!smas[i]) return { upper: null, lower: null, basis: null };
        
        const slice = data.slice(i - period + 1, i + 1);
        const mean = smas[i];
        const squaredDiffs = slice.map(x => Math.pow(x.close - mean, 2));
        const variance = squaredDiffs.reduce((acc, val) => acc + val, 0) / period;
        const stdDev = Math.sqrt(variance);
        
        return {
            basis: mean,
            upper: mean + (multiplier * stdDev),
            lower: mean - (multiplier * stdDev)
        };
    });
};

const resampleToWeekly = (dailyData) => {
    // Assumes dailyData is sorted Oldest -> Newest
    const weeklyMap = new Map();
    
    dailyData.forEach(day => {
        const date = new Date(day.date);
        // Get start of week (Sunday) to group
        const startOfWeek = new Date(date);
        startOfWeek.setDate(date.getDate() - date.getDay());
        const key = startOfWeek.toISOString().split('T')[0];
        
        if (!weeklyMap.has(key)) {
            weeklyMap.set(key, { 
                date: day.date, // Use the actual date of the last available day later
                open: day.close, 
                high: day.close, 
                low: day.close, 
                close: day.close, 
                volume: 0,
                days: [] 
            });
        }
        
        const week = weeklyMap.get(key);
        week.high = Math.max(week.high, day.close);
        week.low = Math.min(week.low, day.close);
        week.close = day.close; // Updates to latest close in that week
        week.date = day.date; // Updates to latest date
        week.volume += day.volume || 0;
        week.days.push(day);
    });
    
    return Array.from(weeklyMap.values());
};

// --- DATA FETCHING ---

const fetchStockData = async (ticker, region) => {
    const symbol = ticker.toUpperCase().trim();
    let finalSymbol = symbol;
    
    // Handle Canada Suffixes
    if (region === 'CA') {
        if (!finalSymbol.endsWith('.TO') && !finalSymbol.endsWith('.V') && !finalSymbol.endsWith('.CN') && !finalSymbol.endsWith('.NE')) {
            finalSymbol += '.TO'; // Default to TSX
        }
    }

    // 1. Yahoo Finance Proxy (Primary for Canada, Fallback for US)
    const fetchYahoo = async () => {
        const queryUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${finalSymbol}?interval=1d&range=2y`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(queryUrl)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error('Yahoo Proxy Failed');
        const json = await res.json();
        const result = json.chart.result[0];
        return result.timestamp.map((ts, i) => ({
            date: new Date(ts * 1000).toISOString().split('T')[0],
            close: result.indicators.quote[0].close[i],
            volume: result.indicators.quote[0].volume[i]
        })).filter(d => d.close !== null);
    };

    // 2. FMP (US Only)
    const fetchFMP = async () => {
        const url = `https://financialmodelingprep.com/api/v3/historical-price-full/${finalSymbol}?apikey=${API_KEYS.FMP}`;
        const res = await fetch(url);
        const json = await res.json();
        if (!json.historical) throw new Error('FMP Failed');
        return json.historical.slice(0, 500).reverse().map(d => ({
            date: d.date,
            close: d.close,
            volume: d.volume
        }));
    };

    // 3. AlphaVantage (US Only)
    const fetchAlpha = async () => {
        // ADDED outputsize=full to ensure we get >100 days (Compact)
        const url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${finalSymbol}&apikey=${API_KEYS.ALPHAVANTAGE}&outputsize=full`;
        const res = await fetch(url);
        const json = await res.json();
        const ts = json['Time Series (Daily)'];
        if (!ts) throw new Error('AlphaVantage Failed');
        // Sort and take last 500 days
        return Object.keys(ts).sort().slice(-500).map(date => ({
            date,
            close: parseFloat(ts[date]['4. close']),
            volume: parseFloat(ts[date]['5. volume'])
        }));
    };

    // Execution Logic
    if (region === 'CA') {
        try { return await fetchYahoo(); } 
        catch (e) { throw new Error(`Failed to fetch Canadian stock ${finalSymbol}.`); }
    } else {
        // Cascade for US
        try { return await fetchFMP(); } catch (e1) {
            console.warn('FMP failed, trying AlphaVantage...');
            try { return await fetchAlpha(); } catch (e2) {
                console.warn('Alpha failed, trying Yahoo...');
                try { return await fetchYahoo(); } catch (e3) {
                    throw new Error(`All sources failed for ${finalSymbol}.`);
                }
            }
        }
    }
};

// --- MAIN APP COMPONENT ---

const App = () => {
    const [ticker, setTicker] = useState('NVDA');
    const [region, setRegion] = useState('US');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState(null);
    const [data, setData] = useState(null);
    const [activeTab, setActiveTab] = useState('DASHBOARD');

    const handleSearch = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setError(null);
        setData(null);

        try {
            const rawData = await fetchStockData(ticker, region);
            if (rawData.length < 50) throw new Error("Insufficient historical data");
            
            // --- PROCESS DATA ---
            
            // 1. Weinstein Analysis (Weekly Data)
            const weeklyData = resampleToWeekly(rawData);
            const weeklySMA30 = calculateSMA(weeklyData, 30);
            
            const latestWeekly = weeklyData[weeklyData.length - 1];
            const prevWeekly = weeklyData[weeklyData.length - 2];
            const latestSMA = weeklySMA30[weeklySMA30.length - 1];
            const prevSMA = weeklySMA30[weeklySMA30.length - 2];
            
            let stage = { id: 0, label: "Indeterminate", color: "#94a3b8" };
            if (latestSMA && prevSMA) {
                const slope = (latestSMA - prevSMA) / prevSMA;
                const priceVsMA = (latestWeekly.close - latestSMA) / latestSMA;
                
                if (slope > 0.0005 && priceVsMA > -0.02) stage = { id: 2, label: "Stage 2: Markup", color: "#4ade80" };
                else if (slope < -0.0005 && priceVsMA < 0.02) stage = { id: 4, label: "Stage 4: Decline", color: "#f87171" };
                else if (priceVsMA < 0) stage = { id: 1, label: "Stage 1: Basing", color: "#facc15" };
                else stage = { id: 3, label: "Stage 3: Topping", color: "#fb923c" };
            }

            // 2. HMM / Risk Engine (Daily Data)
            const returns = [];
            for(let i=1; i<rawData.length; i++) returns.push(Math.log(rawData[i].close / rawData[i-1].close));
            
            const volWindow = 20;
            const volatilities = [];
            for(let i=0; i <= returns.length - volWindow; i++) {
                const slice = returns.slice(i, i+volWindow);
                const mean = slice.reduce((a,b)=>a+b,0)/volWindow;
                const variance = slice.reduce((a,b)=>a+Math.pow(b-mean,2),0)/volWindow;
                volatilities.push(Math.sqrt(variance));
            }
            
            // HMM Percentiles
            const sortedVols = [...volatilities].sort((a,b)=>a-b);
            const lowThresh = sortedVols[Math.floor(sortedVols.length * 0.33)];
            const highThresh = sortedVols[Math.floor(sortedVols.length * 0.66)];
            const currentVol = volatilities[volatilities.length - 1];
            
            let regime = { id: 2, label: "Mid Volatility", desc: "Transitional", color: "#facc15" };
            if (currentVol <= lowThresh) regime = { id: 1, label: "Low Volatility", desc: "Stable/Trending", color: "#4ade80" };
            else if (currentVol >= highThresh) regime = { id: 3, label: "High Volatility", desc: "Erratic/Risk", color: "#f87171" };

            // 3. Technical Signals (Daily Data)
            const rsi = calculateRSI(rawData, 14);
            const macdFast = calculateEMA(rawData, 12);
            const macdSlow = calculateEMA(rawData, 26);
            const bb = calculateBollingerBands(rawData, 20, 2.5);
            const sma50 = calculateSMA(rawData, 50);
            
            const lastIdx = rawData.length - 1;
            const currentRSI = rsi[lastIdx];
            const currentClose = rawData[lastIdx].close;
            const currentBB = bb[lastIdx];
            const currentSMA50 = sma50[lastIdx];
            const macdVal = macdFast[lastIdx] - macdSlow[lastIdx];
            
            // Signal Logic
            let bulls = 0;
            let bears = 0;
            
            if (currentRSI < 30) bulls++; else if (currentRSI > 70) bears++;
            if (currentClose > currentSMA50) bulls++; else bears++;
            if (currentClose < currentBB.lower) bulls++; else if (currentClose > currentBB.upper) bears++;
            if (macdVal > 0) bulls++; else bears++;
            
            let signal = "NEUTRAL";
            let signalColor = "#94a3b8";
            if (bulls >= 3) { signal = "STRONG BUY"; signalColor = "#4ade80"; }
            else if (bears >= 3) { signal = "STRONG SELL"; signalColor = "#f87171"; }

            // Combine for Charting
            const chartData = rawData.map((d, i) => ({
                ...d,
                sma50: sma50[i],
                bbUpper: bb[i]?.upper,
                bbLower: bb[i]?.lower,
                rsi: rsi[i],
                macd: macdFast[i] - macdSlow[i]
            })).slice(-150); // Show last 150 days

            const weinsteinChartData = weeklyData.map((d, i) => ({
                ...d,
                sma30: weeklySMA30[i]
            })).slice(-104); // Last 2 years weeks

            setData({
                summary: {
                    price: currentClose,
                    change: currentClose - rawData[lastIdx-1].close,
                    pct: (currentClose - rawData[lastIdx-1].close)/rawData[lastIdx-1].close,
                    volume: rawData[lastIdx].volume,
                    stage,
                    regime,
                    signal,
                    signalColor,
                    currentVol,
                    lowThresh,
                    highThresh
                },
                daily: chartData,
                weekly: weinsteinChartData
            });

        } catch (err) {
            console.error(err);
            setError(err.message);
        } finally {
            setLoading(false);
        }
    };

    // Auto-search on mount
    useEffect(() => { handleSearch(); }, []);

    return (
        <div className="max-w-7xl mx-auto p-2 md:p-6 pb-20">
            {/* HEADER */}
            <div className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6 gap-4">
                <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-gradient-to-br from-orange-500 to-red-600 rounded flex items-center justify-center text-black font-bold text-xl shadow-lg shadow-orange-900/20">Q</div>
                    <div>
                        <h1 className="text-2xl font-bold tracking-tight text-white">QuantTerminal</h1>
                        <p className="text-xs text-slate-500 terminal-text">V.3.1.0 // BLoomberg-LITE</p>
                    </div>
                </div>

                <form onSubmit={handleSearch} className="flex gap-2 w-full md:w-auto">
                    <select 
                        value={region} 
                        onChange={e => setRegion(e.target.value)}
                        className="bg-slate-900 border border-slate-700 text-slate-300 text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 p-2.5"
                    >
                        <option value="US">US Market</option>
                        <option value="CA">Canada (TSX/V)</option>
                    </select>
                    <div className="relative w-full">
                        <input 
                            type="text" 
                            value={ticker}
                            onChange={e => setTicker(e.target.value)}
                            className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full pl-10 p-2.5 uppercase font-mono" 
                            placeholder="TICKER"
                            required
                        />
                        <div className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                            <Icons.Search />
                        </div>
                    </div>
                    <button type="submit" className="bg-orange-600 hover:bg-orange-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 focus:ring-4 focus:outline-none focus:ring-orange-900 transition-colors">
                        GO
                    </button>
                </form>
            </div>

            {loading && <div className="loading-bar mb-8 rounded-full"></div>}
            
            {error && (
                <div className="p-4 mb-4 text-sm text-red-200 rounded-lg bg-red-900/20 border border-red-800 flex items-center gap-2" role="alert">
                    <Icons.AlertTriangle />
                    <span className="font-medium">System Alert:</span> {error}
                </div>
            )}

            {data && (
                <div className="animate-fade-in space-y-6">
                    
                    {/* TOP SCORECARD */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        {/* Price Card */}
                        <div className="dashboard-panel p-5 rounded-xl">
                            <p className="text-xs text-slate-400 font-bold tracking-wider mb-1">ASSET PRICE</p>
                            <div className="flex items-baseline gap-2">
                                <span className="text-3xl font-mono text-white font-bold">${data.summary.price.toFixed(2)}</span>
                                <span className={`text-sm font-mono font-bold ${data.summary.change >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                    {data.summary.change > 0 ? '+' : ''}{data.summary.pct.toFixed(2)}%
                                </span>
                            </div>
                            <p className="text-xs text-slate-600 mt-2 font-mono">VOL: {new Intl.NumberFormat('en-US', { notation: "compact" }).format(data.summary.volume)}</p>
                        </div>

                        {/* Weinstein Stage */}
                        <div className="dashboard-panel p-5 rounded-xl border-l-4" style={{ borderLeftColor: data.summary.stage.color }}>
                            <p className="text-xs text-slate-400 font-bold tracking-wider mb-1">WEINSTEIN STAGE</p>
                            <div className="text-xl font-bold text-white mb-1">{data.summary.stage.label}</div>
                            <p className="text-xs text-slate-500">Based on 30-Week MA Slope & Price Action</p>
                        </div>

                        {/* Risk Regime */}
                        <div className="dashboard-panel p-5 rounded-xl border-l-4" style={{ borderLeftColor: data.summary.regime.color }}>
                            <p className="text-xs text-slate-400 font-bold tracking-wider mb-1">HMM REGIME</p>
                            <div className="text-xl font-bold text-white mb-1">{data.summary.regime.label}</div>
                            <div className="w-full bg-slate-800 rounded-full h-1.5 mt-2">
                                <div className="h-1.5 rounded-full" style={{ width: `${data.summary.currentVol * 1000}%`, backgroundColor: data.summary.regime.color }}></div>
                            </div>
                        </div>

                        {/* Signal */}
                        <div className="dashboard-panel p-5 rounded-xl border-l-4" style={{ borderLeftColor: data.summary.signalColor }}>
                            <p className="text-xs text-slate-400 font-bold tracking-wider mb-1">COMPOSITE SIGNAL</p>
                            <div className="text-2xl font-black mb-1" style={{ color: data.summary.signalColor }}>{data.summary.signal}</div>
                            <p className="text-xs text-slate-500">3-Factor Confirmation</p>
                        </div>
                    </div>

                    {/* MAIN CONTENT GRID */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        {/* LEFT: MAIN CHART */}
                        <div className="lg:col-span-2 dashboard-panel rounded-xl p-1 md:p-4 h-[500px] flex flex-col">
                            <div className="flex justify-between items-center px-4 py-2 border-b border-slate-800 mb-2">
                                <h3 className="font-bold text-slate-300 flex items-center gap-2">
                                    <Icons.Activity size={16}/> Price Action & Bands
                                </h3>
                                <div className="flex gap-2">
                                    <button onClick={() => setActiveTab('DASHBOARD')} className={`text-xs px-3 py-1 rounded ${activeTab === 'DASHBOARD' ? 'bg-slate-700 text-white' : 'text-slate-500'}`}>Daily</button>
                                    <button onClick={() => setActiveTab('WEEKLY')} className={`text-xs px-3 py-1 rounded ${activeTab === 'WEEKLY' ? 'bg-slate-700 text-white' : 'text-slate-500'}`}>Weekly</button>
                                </div>
                            </div>
                            
                            <div className="flex-1 w-full min-h-0">
                                <ResponsiveContainer width="100%" height="100%">
                                    {activeTab === 'DASHBOARD' ? (
                                        <ComposedChart data={data.daily}>
                                            <defs>
                                                <linearGradient id="colorPrice" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.2}/>
                                                    <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" vertical={false} />
                                            <XAxis dataKey="date" stroke="#475569" tick={{fontSize: 10}} minTickGap={30} />
                                            <YAxis domain={['auto', 'auto']} stroke="#475569" orientation="right" tick={{fontSize: 10}} tickFormatter={val => `$${val}`} />
                                            <Tooltip contentStyle={{backgroundColor: '#0f172a', borderColor: '#334155', color: '#f8fafc'}} />
                                            <Legend verticalAlign="top" height={36}/>
                                            <Area type="monotone" dataKey="close" stroke="#3b82f6" fill="url(#colorPrice)" name="Price" strokeWidth={2} />
                                            <Line type="monotone" dataKey="sma50" stroke="#fbbf24" dot={false} strokeWidth={1.5} name="50 SMA" />
                                            <Line type="monotone" dataKey="bbUpper" stroke="#ef4444" strokeDasharray="3 3" dot={false} strokeWidth={1} name="BB Upper" />
                                            <Line type="monotone" dataKey="bbLower" stroke="#22c55e" strokeDasharray="3 3" dot={false} strokeWidth={1} name="BB Lower" />
                                        </ComposedChart>
                                    ) : (
                                        <ComposedChart data={data.weekly}>
                                            <CartesianGrid stroke="#1e293b" strokeDasharray="3 3" vertical={false} />
                                            <XAxis dataKey="date" stroke="#475569" tick={{fontSize: 10}} minTickGap={30} />
                                            <YAxis domain={['auto', 'auto']} stroke="#475569" orientation="right" tick={{fontSize: 10}} tickFormatter={val => `$${val}`} />
                                            <Tooltip contentStyle={{backgroundColor: '#0f172a', borderColor: '#334155', color: '#f8fafc'}} />
                                            <Legend verticalAlign="top" height={36}/>
                                            <Line type="monotone" dataKey="close" stroke="#cbd5e1" dot={false} strokeWidth={2} name="Weekly Price" />
                                            <Line type="monotone" dataKey="sma30" stroke="#f97316" dot={false} strokeWidth={3} name="30-Week MA" />
                                        </ComposedChart>
                                    )}
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* RIGHT: STRATEGY TABS */}
                        <div className="dashboard-panel rounded-xl p-6 flex flex-col gap-6">
                            
                            {/* WEINSTEIN */}
                            <div>
                                <h4 className="text-orange-400 font-bold text-sm uppercase mb-3 flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-orange-500"></div> Weinstein Analysis
                                </h4>
                                <div className="space-y-3">
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-400">Trend Definition</span>
                                        <span className="text-white font-mono">30-Week SMA</span>
                                    </div>
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-400">Current Slope</span>
                                        <span className={`${data.summary.stage.id === 2 ? 'text-green-400' : 'text-slate-200'} font-mono`}>
                                            {data.summary.stage.id === 2 ? 'RISING' : data.summary.stage.id === 4 ? 'FALLING' : data.summary.stage.id === 0 ? 'N/A' : 'FLAT'}
                                        </span>
                                    </div>
                                    <div className="p-3 bg-slate-900 rounded border border-slate-700 mt-2">
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            {data.summary.stage.id === 2 && "Price is advancing above a rising 30-week MA. This is the ideal 'Markup' phase for long positions."}
                                            {data.summary.stage.id === 4 && "Price is declining below a falling 30-week MA. 'Markdown' phase. Avoid long positions."}
                                            {data.summary.stage.id === 1 && "Price is chopping sideways. Accumulation phase possible. Wait for breakout."}
                                            {data.summary.stage.id === 3 && "Price is topping out. Distribution phase likely. Tighten stops."}
                                            {data.summary.stage.id === 0 && "Insufficient data: Weinstein analysis requires at least 30 weeks (~7 months) of price history to calculate the long-term Moving Average."}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="h-px bg-slate-800"></div>

                            {/* HMM RISK */}
                            <div>
                                <h4 className="text-blue-400 font-bold text-sm uppercase mb-3 flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-blue-500"></div> HMM Risk Engine
                                </h4>
                                <div className="space-y-2">
                                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                                        <span>Low Vol ({(data.summary.lowThresh*100).toFixed(1)}%)</span>
                                        <span>High Vol ({(data.summary.highThresh*100).toFixed(1)}%)</span>
                                    </div>
                                    <div className="w-full bg-slate-900 rounded h-2 overflow-hidden flex">
                                        <div style={{width: '33%'}} className="bg-green-900/40 border-r border-slate-800"></div>
                                        <div style={{width: '33%'}} className="bg-yellow-900/40 border-r border-slate-800"></div>
                                        <div style={{width: '34%'}} className="bg-red-900/40"></div>
                                    </div>
                                    <div className="relative w-full h-4 -mt-3">
                                        <div 
                                            className="absolute w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[8px] border-b-white transform -translate-x-1/2 transition-all duration-1000"
                                            style={{ left: `${Math.min(data.summary.currentVol / (data.summary.highThresh * 1.5), 1) * 100}%` }}
                                        ></div>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-2">
                                        Current Volatility: <span className="text-white font-mono">{(data.summary.currentVol*100).toFixed(2)}%</span>.
                                        Regime: <span style={{color: data.summary.regime.color}}>{data.summary.regime.label}</span>.
                                    </p>
                                </div>
                            </div>

                        </div>

                        {/* BOTTOM: SUB-CHARTS (RSI & MACD) */}
                        <div className="lg:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="dashboard-panel p-4 rounded-xl h-48">
                                <h4 className="text-slate-400 text-xs font-bold mb-2">RSI (14) MOMENTUM</h4>
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={data.daily}>
                                        <YAxis domain={[0, 100]} hide />
                                        <ReferenceLine y={70} stroke="#ef4444" strokeDasharray="3 3" />
                                        <ReferenceLine y={30} stroke="#22c55e" strokeDasharray="3 3" />
                                        <Line type="monotone" dataKey="rsi" stroke="#a855f7" strokeWidth={2} dot={false} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>
                            <div className="dashboard-panel p-4 rounded-xl h-48">
                                <h4 className="text-slate-400 text-xs font-bold mb-2">MACD OSCILLATOR</h4>
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={data.daily}>
                                        <YAxis hide />
                                        <ReferenceLine y={0} stroke="#475569" />
                                        <Bar dataKey="macd" fill="#3b82f6">
                                            {data.daily.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={entry.macd > 0 ? '#4ade80' : '#f87171'} />
                                            ))}
                                        </Bar>
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                    </div>
                </div>
            )}
            
            <footer className="mt-12 border-t border-slate-800 pt-6 text-center text-slate-600 text-xs">
                <p>QUANTTERMINAL ANALYTICS ENGINE &bull; RENDER-READY &bull; NO SERVER REQUIRED</p>
                <p className="mt-2 opacity-50">Data provided by Yahoo Finance Proxy (CA) & FMP/AlphaVantage (US). Not financial advice.</p>
            </footer>
        </div>
    );
};

// --- RENDER ---
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Helper for Recharts BarChart Cell (needed since we used it above)
const { BarChart, Cell } = Recharts;

</script>
</body>
</html>
